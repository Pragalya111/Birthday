<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Rubha 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page welcome-page">
        <!-- Animated background -->
        <div class="background-wrapper">
            <div class="gradient-bg"></div>
            
            <!-- Twinkling stars -->
            <div class="stars-container">
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
            </div>

            <!-- Floating clouds -->
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>

            <!-- Rainbow -->
            <div class="rainbow-container">
                <div class="rainbow"></div>
            </div>

            <!-- Floating sparkles -->
            <div class="sparkles-container">
                <div class="sparkle sparkle-1"></div>
                <div class="sparkle sparkle-2"></div>
                <div class="sparkle sparkle-3"></div>
                <div class="sparkle sparkle-4"></div>
                <div class="sparkle sparkle-5"></div>
                <div class="sparkle sparkle-6"></div>
                <div class="sparkle sparkle-7"></div>
                <div class="sparkle sparkle-8"></div>
            </div>

            <!-- Animated Unicorn -->
            <div class="unicorn-container">
                <svg class="unicorn" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                    <!-- Unicorn body -->
                    <ellipse cx="50" cy="50" rx="25" ry="20" fill="#FFB6E8"/>
                    
                    <!-- Unicorn head -->
                    <circle cx="28" cy="35" r="15" fill="#FFB6E8"/>
                    
                    <!-- Ears -->
                    <ellipse cx="20" cy="22" rx="4" ry="10" fill="#FFB6E8"/>
                    <ellipse cx="36" cy="20" rx="4" ry="10" fill="#FFB6E8"/>
                    <ellipse cx="20" cy="24" rx="2" ry="7" fill="#E8A0D0"/>
                    <ellipse cx="36" cy="22" rx="2" ry="7" fill="#E8A0D0"/>
                    
                    <!-- Horn -->
                    <polygon points="28,18 26,0 30,18" fill="#FFD700"/>
                    <polygon points="27.5,17 28,8 28.5,17" fill="#FFF"/>
                    
                    <!-- Eyes -->
                    <circle cx="24" cy="32" r="2" fill="#333"/>
                    <circle cx="32" cy="32" r="2" fill="#333"/>
                    
                    <!-- Muzzle -->
                    <ellipse cx="25" cy="40" rx="5" ry="4" fill="#FFE0F0"/>
                    
                    <!-- Mane -->
                    <path d="M 30 20 Q 32 15 35 20" stroke="#FF69B4" stroke-width="2" fill="none"/>
                    <path d="M 32 25 Q 35 20 38 25" stroke="#FF69B4" stroke-width="2" fill="none"/>
                    
                    <!-- Legs -->
                    <rect x="42" y="65" width="4" height="12" fill="#FFB6E8" rx="2"/>
                    <rect x="52" y="65" width="4" height="12" fill="#FFB6E8" rx="2"/>
                    <rect x="46" y="67" width="4" height="10" fill="#FFB6E8" rx="2"/>
                    <rect x="56" y="67" width="4" height="10" fill="#FFB6E8" rx="2"/>
                    
                    <!-- Tail -->
                    <path d="M 75 48 Q 85 45 90 35" stroke="#FF69B4" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M 76 50 Q 86 48 91 40" stroke="#FF1493" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <!-- Content -->
        <div class="content-wrapper">
            <div class="hero-content">
                <h1 class="hero-title">Happy Birthday Rubha 💖</h1>
                <p class="hero-subtitle">A magical journey has been prepared just for you</p>
                <button class="magic-button" onclick="navigateTo('pandas.html')">
                    Begin The Adventure ✨
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
