<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Wishes - Happy Birthday Rubha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page pandas-page">
        <!-- Animated background -->
        <div class="background-wrapper">
            <div class="gradient-bg gradient-variant-2"></div>
            
            <!-- Rainbow -->
            <div class="rainbow-container">
                <div class="rainbow"></div>
            </div>

            <!-- Floating hearts and stars -->
            <div class="particles-container">
                <div class="heart heart-1">💖</div>
                <div class="star star-1"></div>
                <div class="heart heart-2">💖</div>
                <div class="star star-2"></div>
                <div class="heart heart-3">💖</div>
                <div class="star star-3"></div>
                <div class="heart heart-4">💖</div>
            </div>
        </div>

        <!-- Content -->
        <div class="content-wrapper pandas-content">
            <h1 class="page-title">🐼 Panda Birthday Wishes 🐼</h1>

            <div class="pandas-grid">
                <!-- Panda 1 -->
                <div class="panda-card glass-card">
                    <div class="panda-box">
                        <svg class="panda" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <!-- Head -->
                            <circle cx="50" cy="45" r="35" fill="#FFF"/>
                            <!-- Left ear -->
                            <circle cx="28" cy="18" r="12" fill="#000"/>
                            <!-- Right ear -->
                            <circle cx="72" cy="18" r="12" fill="#000"/>
                            <!-- Left eye patch -->
                            <ellipse cx="38" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Right eye patch -->
                            <ellipse cx="62" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Eyes -->
                            <circle cx="38" cy="33" r="4" fill="#FFF"/>
                            <circle cx="62" cy="33" r="4" fill="#FFF"/>
                            <circle cx="38" cy="33" r="2" fill="#000"/>
                            <circle cx="62" cy="33" r="2" fill="#000"/>
                            <!-- Nose -->
                            <circle cx="50" cy="48" r="3" fill="#000"/>
                            <!-- Mouth -->
                            <path d="M 50 48 Q 45 52 42 50" stroke="#000" stroke-width="1.5" fill="none"/>
                            <path d="M 50 48 Q 55 52 58 50" stroke="#000" stroke-width="1.5" fill="none"/>
                            <!-- Body -->
                            <ellipse cx="50" cy="75" rx="20" ry="18" fill="#FFF"/>
                            <!-- Left arm -->
                            <ellipse cx="32" cy="65" rx="8" ry="18" fill="#000"/>
                            <!-- Right arm -->
                            <ellipse cx="68" cy="65" rx="8" ry="18" fill="#000"/>
                            <!-- Cheeks -->
                            <circle cx="25" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                            <circle cx="75" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="speech-bubble">
                        <p>Happy Birthday<br>Rubha 💖</p>
                    </div>
                </div>

                <!-- Panda 2 -->
                <div class="panda-card glass-card">
                    <div class="panda-box">
                        <svg class="panda panda-wave" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <!-- Head -->
                            <circle cx="50" cy="45" r="35" fill="#FFF"/>
                            <!-- Left ear -->
                            <circle cx="28" cy="18" r="12" fill="#000"/>
                            <!-- Right ear -->
                            <circle cx="72" cy="18" r="12" fill="#000"/>
                            <!-- Left eye patch -->
                            <ellipse cx="38" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Right eye patch -->
                            <ellipse cx="62" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Eyes -->
                            <circle cx="38" cy="33" r="4" fill="#FFF"/>
                            <circle cx="62" cy="33" r="4" fill="#FFF"/>
                            <circle cx="38" cy="33" r="2" fill="#000"/>
                            <circle cx="62" cy="33" r="2" fill="#000"/>
                            <!-- Nose -->
                            <circle cx="50" cy="48" r="3" fill="#000"/>
                            <!-- Mouth happy -->
                            <path d="M 45 50 Q 50 54 55 50" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <!-- Body -->
                            <ellipse cx="50" cy="75" rx="20" ry="18" fill="#FFF"/>
                            <!-- Left arm (waving) -->
                            <ellipse cx="32" cy="60" rx="8" ry="15" fill="#000"/>
                            <!-- Right arm -->
                            <ellipse cx="68" cy="65" rx="8" ry="18" fill="#000"/>
                            <!-- Cheeks -->
                            <circle cx="25" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                            <circle cx="75" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="speech-bubble">
                        <p>May all your<br>dreams come true ✨</p>
                    </div>
                </div>

                <!-- Panda 3 -->
                <div class="panda-card glass-card">
                    <div class="panda-box">
                        <svg class="panda" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <!-- Head -->
                            <circle cx="50" cy="45" r="35" fill="#FFF"/>
                            <!-- Left ear -->
                            <circle cx="28" cy="18" r="12" fill="#000"/>
                            <!-- Right ear -->
                            <circle cx="72" cy="18" r="12" fill="#000"/>
                            <!-- Left eye patch -->
                            <ellipse cx="38" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Right eye patch -->
                            <ellipse cx="62" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Eyes -->
                            <circle cx="38" cy="33" r="4" fill="#FFF"/>
                            <circle cx="62" cy="33" r="4" fill="#FFF"/>
                            <circle cx="38" cy="33" r="2" fill="#000"/>
                            <circle cx="62" cy="33" r="2" fill="#000"/>
                            <!-- Nose -->
                            <circle cx="50" cy="48" r="3" fill="#000"/>
                            <!-- Mouth -->
                            <path d="M 50 48 Q 45 52 42 50" stroke="#000" stroke-width="1.5" fill="none"/>
                            <path d="M 50 48 Q 55 52 58 50" stroke="#000" stroke-width="1.5" fill="none"/>
                            <!-- Body -->
                            <ellipse cx="50" cy="75" rx="20" ry="18" fill="#FFF"/>
                            <!-- Left arm -->
                            <ellipse cx="32" cy="65" rx="8" ry="18" fill="#000"/>
                            <!-- Right arm -->
                            <ellipse cx="68" cy="65" rx="8" ry="18" fill="#000"/>
                            <!-- Cheeks -->
                            <circle cx="25" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                            <circle cx="75" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="speech-bubble">
                        <p>You are<br>amazing 🌈</p>
                    </div>
                </div>

                <!-- Panda 4 -->
                <div class="panda-card glass-card">
                    <div class="panda-box">
                        <svg class="panda panda-bounce" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <!-- Head -->
                            <circle cx="50" cy="45" r="35" fill="#FFF"/>
                            <!-- Left ear -->
                            <circle cx="28" cy="18" r="12" fill="#000"/>
                            <!-- Right ear -->
                            <circle cx="72" cy="18" r="12" fill="#000"/>
                            <!-- Left eye patch -->
                            <ellipse cx="38" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Right eye patch -->
                            <ellipse cx="62" cy="35" rx="10" ry="14" fill="#000"/>
                            <!-- Eyes -->
                            <circle cx="38" cy="33" r="4" fill="#FFF"/>
                            <circle cx="62" cy="33" r="4" fill="#FFF"/>
                            <circle cx="38" cy="33" r="2" fill="#000"/>
                            <circle cx="62" cy="33" r="2" fill="#000"/>
                            <!-- Nose -->
                            <circle cx="50" cy="48" r="3" fill="#000"/>
                            <!-- Mouth happy -->
                            <path d="M 45 50 Q 50 54 55 50" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <!-- Body -->
                            <ellipse cx="50" cy="75" rx="20" ry="18" fill="#FFF"/>
                            <!-- Left arm -->
                            <ellipse cx="32" cy="65" rx="8" ry="18" fill="#000"/>
                            <!-- Right arm -->
                            <ellipse cx="68" cy="65" rx="8" ry="18" fill="#000"/>
                            <!-- Cheeks -->
                            <circle cx="25" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                            <circle cx="75" cy="45" r="5" fill="#FFB6D9" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="speech-bubble">
                        <p>Today is your<br>special day 🦄</p>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button class="magic-button" onclick="navigateTo('letter.html')">
                    Open My Letter 💌
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
