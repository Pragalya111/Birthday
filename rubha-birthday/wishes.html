<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wishes - Happy Birthday Rubha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page wishes-page">
        <!-- Animated background -->
        <div class="background-wrapper">
            <div class="gradient-bg gradient-variant-2"></div>
            
            <!-- Floating particles -->
            <div class="particles-container">
                <div class="star star-1"></div>
                <div class="star star-2"></div>
                <div class="heart heart-1">💖</div>
                <div class="star star-3"></div>
                <div class="heart heart-2">💖</div>
                <div class="star star-4"></div>
            </div>
        </div>

        <!-- Content -->
        <div class="content-wrapper wishes-content">
            <h1 class="page-title">✨ Birthday Wishes For You ✨</h1>

            <div class="wishes-grid">
                <!-- Wish 1 -->
                <div class="wish-card glass-card wish-card-1">
                    <div class="wish-icon">🌸</div>
                    <p class="wish-text">May your smile never fade.</p>
                </div>

                <!-- Wish 2 -->
                <div class="wish-card glass-card wish-card-2">
                    <div class="wish-icon">✨</div>
                    <p class="wish-text">May every dream find its way to reality.</p>
                </div>

                <!-- Wish 3 -->
                <div class="wish-card glass-card wish-card-3">
                    <div class="wish-icon">💖</div>
                    <p class="wish-text">May happiness always stay close to you.</p>
                </div>

                <!-- Wish 4 -->
                <div class="wish-card glass-card wish-card-4">
                    <div class="wish-icon">🌈</div>
                    <p class="wish-text">May life surprise you beautifully.</p>
                </div>

                <!-- Wish 5 -->
                <div class="wish-card glass-card wish-card-5">
                    <div class="wish-icon">🎯</div>
                    <p class="wish-text">May success follow every step you take.</p>
                </div>

                <!-- Wish 6 -->
                <div class="wish-card glass-card wish-card-6">
                    <div class="wish-icon">🦄</div>
                    <p class="wish-text">May your future be as magical as your dreams.</p>
                </div>
            </div>

            <div class="button-container">
                <button class="magic-button" onclick="navigateTo('final.html')">
                    One Final Message ❤️
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
